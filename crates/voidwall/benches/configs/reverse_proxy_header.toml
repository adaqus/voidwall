# Reverse proxy with header action only (measures header action overhead)

[pii]
countries = []
languages = []
scanner_threads = 4

[scan]
on_error = "fail_open"

[reverse_proxy]
enabled = true
listen = "0.0.0.0:8082"

[reverse_proxy.request]
actions = ["header"]

[reverse_proxy.response]
actions = []

[[reverse_proxy.routes]]
path_prefix = "/"
upstream = "http://127.0.0.1:8090"

[admin]
listen = "127.0.0.1:9090"
