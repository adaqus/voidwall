# Default proxy config for the Docker dev environment.
# The echo server runs as a sibling container on the "echo-server" hostname.

# Ingest keys come first. TOML binds a bare key to the table above it, so one
# written after a [section] parses as that section's field and is rejected.
max_body_size = 1048576
on_error = "fail_close"
upstream_timeout_secs = 300
# A text/event-stream on a route with format = "openai-chat". Defaults shown.
# stream_idle_timeout_secs = 60  # longest gap between two reads of a stream
# stream_holdback_bytes = 512    # text kept back behind the newest text; <= max_body_size
# stream_context_bytes = 512     # sent text each scan covers; <= max_body_size
# stream_scan_bytes = 256        # new text that starts the next scan; <= stream_holdback_bytes

[builtin_guards.pii]
countries = []
languages = []
scanner_threads = 6

# A model-backed guard is declared in its own section. One section carries
# everything one guard needs to run one model — there is no model section and no
# model reference — and its surface defaults to the body alone, because each
# unit it admits costs one model execution.
#
# The image ships no model. `docker/ctl fetch_models` downloads Wolf Defender
# Prompt-Injection Detector Small v2 into models/wolf-small/, and the compose
# file mounts it. The guard loads its model at startup (/readyz answers 503 until
# it ends) and blocks on its findings. A model that fails to load stops the start.
#
# The window, overlap, and threshold are the values on the model card.

[guards.prompt_injection]
adapter = "text_classifier"
model_path = "/opt/voidwall/models/wolf-small/model.onnx"
tokenizer_path = "/opt/voidwall/models/wolf-small/tokenizer.json"
max_tokens = 2048
labels = ["PROMPT_INJECTION"]   # text_classifier: one label, naming class 1
overlap_tokens = 64             # optional; default min(128, max_tokens / 2)
# threads = 4                   # optional; default CPUs / number of model guards

[guards.prompt_injection.thresholds]
PROMPT_INJECTION = 0.5

[reverse_proxy]
enabled = true
listen = "0.0.0.0:8082"

[reverse_proxy.request]
scan = true

# Left off deliberately: the bundled echo server reflects the request, so
# scanning the response would block on the client's own Host header.
[reverse_proxy.response]
scan = false

[[reverse_proxy.routes]]
path_prefix = "/"
upstream = "http://echo-server:8090"

[http_api]
enabled = true
listen = "0.0.0.0:8083"

[admin]
listen = "0.0.0.0:9090"
