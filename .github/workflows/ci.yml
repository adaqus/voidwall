name: CI

on:
  # Branches only: a tag push runs CI once, through the release workflow.
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read
  attestations: read

# Actions are pinned to commit SHAs; the comment names the ref they came from.
jobs:
  check:
    runs-on: ubuntu-24.04
    # One build per branch: a newer push cancels a build still waiting to start.
    # The commits job has no group: a cancelled run would leave its commits unchecked.
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: false
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy

      # Vectorscan is built from source by vectorscan-rs-sys.
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libboost-dev patch xz-utils

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-deny

      # Keyed by the script, which holds the pinned version and archive hash, so
      # a new pin is a new key here and in release.yml. The fetch script
      # re-hashes a restored library and fetches again unless it matches the
      # hash it recorded.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ort
          key: ort-${{ hashFiles('docker/fetch-ort.sh') }}

      - name: Fetch and verify ONNX Runtime
        run: docker/fetch-ort.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: License gate
        run: cargo deny check licenses

      - name: Check
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  commits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: committed@1.1.11

      # committed checks the style of merge commits too, so they are left out.
      - name: Commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            # A new branch, or a force push that dropped the old tip.
            range="origin/main..$AFTER"
          fi
          git rev-list --no-merges "$range" | xargs -r -n1 committed
