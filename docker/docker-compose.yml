services:
  voidwall:
    build:
      context: ..
      dockerfile: docker/Dockerfile.voidwall
    command: ["--config", "/etc/voidwall/voidwall.toml"]
    volumes:
      - ./voidwall.toml:/etc/voidwall/voidwall.toml:ro
      # Fetched by `docker/ctl fetch_models`; the image ships no model. A missing
      # directory fails the start instead of being created as root, which would
      # stop a later fetch from writing into models/.
      - type: bind
        source: ../models/wolf-small
        target: /opt/voidwall/models/wolf-small
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "8082:8082"
      - "8083:8083"
      - "9090:9090"
    depends_on:
      - echo-server

  echo-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.voidwall
    entrypoint: ["echo-server", "--listen", "0.0.0.0:8090"]
    ports:
      - "8090:8090"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    depends_on:
      - voidwall

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
