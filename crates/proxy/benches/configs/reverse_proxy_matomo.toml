# Reverse proxy with the Matomo specialization on the catch-all route.
# Used by the matomo_specialization benchmark to measure end-to-end cost
# of per-field decode → scan → redact → re-encode for Matomo tracker
# payloads.

[pii]
countries = []
languages = []
scanner_threads = 4

[scan]
on_error = "fail_open"

[reverse_proxy]
enabled = true
listen = "0.0.0.0:8082"

[reverse_proxy.request]
actions = ["redact"]
redact_strategy = "type_label"

[reverse_proxy.response]
actions = []

[[reverse_proxy.routes]]
path_prefix = "/"
upstream = "http://127.0.0.1:8090"
specialization = "matomo"

[admin]
listen = "127.0.0.1:9090"
