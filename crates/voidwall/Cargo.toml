[package]
name = "voidwall"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
autobenches = false

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP framework & server
axum = "0.8"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
http-body-util = "0.1"

# Serialization & config
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
toml = "0.8"
csv = "1"

# Metrics
prometheus = { version = "0.13", default-features = false }
lazy_static = "1"

# Process metrics
procfs = "0.17"

# Utilities
bytes = "1"
crossbeam-channel = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Allocator
tikv-jemallocator = "0.6"

# PII scanning
voidwall-pii = { path = "../voidwall-pii" }

# Model runtime: adapter kinds today, ONNX Runtime from S5 on
voidwall-ml = { path = "../voidwall-ml" }
regex = "1"
# The longest possible match of a hidden context marker, for the hold-back bound.
regex-syntax = "0.8"
percent-encoding = "2"

# OpenAPI spec generation
utoipa = "5"

[dev-dependencies]
# Fixture models for the model guard tests.
voidwall-ml = { path = "../voidwall-ml", features = ["test-fixtures"] }
test-case = "3.3.1"
# Property tests of the model guard's map from text back to unit bytes.
proptest = "1.12.0"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
