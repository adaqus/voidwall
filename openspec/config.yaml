schema: spec-driven

context: |
  Voidwall — an HTTP proxy and REST API that detects PII in HTTP traffic. A
  detection blocks the message with a fixed 403 naming the kinds found. There is
  no action to choose and nothing rewrites a message.

  Language: Rust, edition 2024. Platform: Linux only. Never add code for another OS.

  Workspace, two crates:
  - `crates/voidwall/` — the binary, package `voidwall`. Integration tests in
    `crates/voidwall/tests/`. Load tests and benches in `crates/voidwall/benches/`.
  - `crates/voidwall-pii/` — the detection library. Read `crates/voidwall-pii/AGENTS.md` before you
    edit anything under it.

  Four modes share one `ScannerPool`: reverse proxy :8082, forward proxy :8084,
  REST API :8083, admin :9090. Config is TOML, loaded with `--config` or
  `VOIDWALL_CONFIG`.

  Build and verify:
    cargo check --workspace
    cargo test --workspace
    cargo clippy --workspace --all-targets   # treat a warning as an error

  PII safety rules. These are non-negotiable:
  - Never log a PII value. Log the kind name and the match count only.
  - Never put a PII value in a metric. Labels carry kind names, never values.
  - Never put a PII value in an error response. A 403 lists kinds, not matched text.
  - Drop the body buffer as soon as the scan ends.

  Threading. The scanner is CPU-bound and must never run on the tokio runtime.
  `ScannerPool` spawns dedicated OS threads. Each thread owns one `voidwall_pii::Scanner`.
  A bounded channel carries the request. A `tokio::sync::oneshot` carries the reply.

  Match resolution. `execute_scan` runs every scanner result through
  `voidwall_pii::resolve_overlaps` before it counts or reports. The proxy works on
  the resolved set only. The policy lives in `crates/voidwall-pii/src/overlap.rs`.

  Outcome: a detection blocks with a fixed 403 and short-circuits forwarding. The
  status, body, and headers are not configurable. There is no redact, header, or
  `warn` action. `reverse_proxy.request.scan` and `.response.scan` turn inspection
  on or off per direction.

  Errors. Use the `Error` enum in `error.rs`. Scanner failures and limit violations
  follow the `on_error` policy, `fail_open` or `fail_close`. `fail_close` is the default.
  A blocking error answers the status that names the party at fault: 413 oversize, 400
  unparseable body, 500 scanner failure. 502 is for the upstream only. Always increment
  `voidwall_errors_total`.

  Config. Validation runs at startup and the proxy refuses to start on bad config.
  A per-route override fully replaces the default. It never merges.

  Testing. Unit tests sit in the same file, in `#[cfg(test)] mod tests`. Use
  `#[test_case()]` where it fits, to cut duplicated test code.

  Architecture and rationale: `ARCHITECTURE.md`. Unbuilt work: `docs/backlog.md`.
  History for Phases 1 to 20: `docs/history/tasks-phases-1-20.md`.

rules:
  specs:
    - A spec states behaviour that is built and covered by a test. Never write a
      requirement for unbuilt work. Unbuilt work belongs in docs/backlog.md.
    - Never put a PII value in an example. Use a placeholder.
  tasks:
    - Every task names a verification check.
