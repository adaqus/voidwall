[package]
name = "pii"
description = "Library detecting various Personally Identifiable Information"
version = "0.1.0"
edition = "2024"

[features]
parallel = ["rayon"]
hyperscan = ["vectorscan-rs"]

[dependencies]
regex = "1"
rayon = { version = "1", optional = true }
vectorscan-rs = { version = "0.0.5", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
test-case = "3"

[[bench]]
name = "pii_benchmark"
harness = false
