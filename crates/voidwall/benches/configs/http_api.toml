# HTTP API mode (only) — used by the http_api benchmark.
#
# All other modes are disabled so the listener under test is the API on :8083.

# Ingest keys come first: a bare key written after a [section] binds to
# that section and is rejected.
on_error = "fail_open"

[builtin_guards.pii]
countries = []
languages = []
scanner_threads = 4

[http_api]
enabled = true
listen = "0.0.0.0:8083"

[admin]
listen = "127.0.0.1:9090"
