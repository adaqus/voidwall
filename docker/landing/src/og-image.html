<!DOCTYPE html>
<!--
  Open Graph / social share card — source for assets/og-image.png.
  build.sh screenshots this at 1200×630 with headless Chromium (served by the
  same nginx as the page pre-render, so the Geist webfont loads). Edit here,
  then run ./build.sh to regenerate the PNG. Not a page route; never linked.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Real stylesheet: pulls in the Geist @font-face rules + font files. -->
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    html, body { margin: 0; padding: 0; }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0A0E1A;
      color: #F4F2EE;
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    /* Violet glow, upper-right — echoes the accent bar of the logo. */
    .glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(620px 520px at 82% 22%,
                                  rgba(139, 125, 246, 0.28), transparent 62%);
    }
    /* The "wall" motif, bled off the right edge, behind the copy. */
    .wall { position: absolute; right: 0; top: 0; height: 630px; }
    .content {
      position: absolute;
      inset: 0;
      padding: 76px 84px;
      display: flex;
      flex-direction: column;
    }
    .brand { display: flex; align-items: center; gap: 15px; }
    .brand-name { font-size: 30px; font-weight: 600; letter-spacing: -0.01em; }
    .eyebrow {
      margin: 64px 0 22px;
      font-size: 19px; font-weight: 600;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: #8B7DF6;
    }
    .headline {
      margin: 0;
      max-width: 660px;
      font-size: 66px; font-weight: 600;
      line-height: 1.05; letter-spacing: -0.022em;
      color: #F4F2EE;
    }
    .sub {
      margin: 28px 0 0;
      max-width: 620px;
      font-size: 27px; font-weight: 400; line-height: 1.4;
      color: #C4C8D6;
    }
    .url {
      margin-top: auto;
      font-size: 25px; font-weight: 500; letter-spacing: 0.01em;
      color: #8B7DF6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="glow"></div>

    <svg class="wall" width="500" height="630" viewBox="0 0 500 630" fill="none">
      <g stroke-linecap="square">
        <line x1="40"  y1="120" x2="40"  y2="512" stroke="#F4F2EE" stroke-width="3" opacity="0.08"/>
        <line x1="80"  y1="120" x2="80"  y2="512" stroke="#F4F2EE" stroke-width="3" opacity="0.08"/>
        <line x1="120" y1="120" x2="120" y2="512" stroke="#F4F2EE" stroke-width="3" opacity="0.08"/>
        <line x1="160" y1="120" x2="160" y2="512" stroke="#F4F2EE" stroke-width="3" opacity="0.08"/>
        <line x1="200" y1="120" x2="200" y2="512" stroke="#F4F2EE" stroke-width="3" opacity="0.08"/>
        <line x1="240" y1="120" x2="240" y2="512" stroke="#F4F2EE" stroke-width="3" opacity="0.08"/>
        <line x1="280" y1="120" x2="280" y2="512" stroke="#F4F2EE" stroke-width="3" opacity="0.08"/>
        <line x1="320" y1="120" x2="320" y2="512" stroke="#F4F2EE" stroke-width="3" opacity="0.08"/>
        <line x1="360" y1="112" x2="360" y2="520" stroke="#8B7DF6" stroke-width="5"
              style="filter: drop-shadow(0 0 14px rgba(139,125,246,0.85));"/>
        <line x1="400" y1="120" x2="400" y2="512" stroke="#F4F2EE" stroke-width="3" opacity="0.08"/>
        <line x1="440" y1="120" x2="440" y2="512" stroke="#F4F2EE" stroke-width="3" opacity="0.08"/>
      </g>
      <line x1="24" y1="524" x2="460" y2="524" stroke="#F4F2EE" stroke-width="2" opacity="0.16"/>
    </svg>

    <div class="content">
      <div class="brand">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <g stroke-linecap="square">
            <line x1="10" y1="8" x2="10" y2="32" stroke="#F4F2EE" stroke-width="2"/>
            <line x1="15" y1="8" x2="15" y2="32" stroke="#F4F2EE" stroke-width="2"/>
            <line x1="20" y1="8" x2="20" y2="32" stroke="#F4F2EE" stroke-width="2"/>
            <line x1="25" y1="8" x2="25" y2="32" stroke="#F4F2EE" stroke-width="2"/>
            <line x1="30" y1="6" x2="30" y2="34" stroke="#B5A8FF" stroke-width="2.4"/>
          </g>
          <line x1="6" y1="35.5" x2="34" y2="35.5" stroke="#F4F2EE" stroke-width="1.2" opacity="0.45"/>
        </svg>
        <span class="brand-name">Voidwall</span>
      </div>

      <p class="eyebrow">Self-hosted HTTP proxy &amp; API</p>
      <h1 class="headline"><span style="color:#8B7DF6">Ultra-fast</span> PII detection inside your infrastructure</h1>
      <p class="sub">Detect, redact, or block personal data in HTTP, API, and AI traffic — in real time.</p>

      <div class="url">voidwall.io</div>
    </div>
  </div>
</body>
</html>
