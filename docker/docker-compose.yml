services:
  proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile.proxy
    command: ["--config", "/etc/pii-proxy/proxy.toml"]
    volumes:
      - ./proxy.toml:/etc/pii-proxy/proxy.toml:ro
    ports:
      - "8082:8082"
      - "8083:8083"
      - "9090:9090"
    depends_on:
      - echo-server

  demo:
    image: nginx:alpine
    environment:
      PII_API_URL: http://localhost:8083
    volumes:
      - ./demo/index.html:/usr/share/nginx/html/index.html:ro
      - ./demo/config.js.template:/usr/share/nginx/html/config.js.template:ro
      - ./demo/30-render-config.sh:/docker-entrypoint.d/30-render-config.sh:ro
    ports:
      - "8088:80"
    depends_on:
      - proxy

  echo-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.proxy
    entrypoint: ["echo-server", "--listen", "0.0.0.0:8090"]
    ports:
      - "8090:8090"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    depends_on:
      - proxy

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
