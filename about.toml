# License notices for the Rust crates linked into `voidwall`, generated by
# `cargo about generate` (see docker/ctl compile). Keep `accepted` and the
# per-crate exception in step with deny.toml.
accepted = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "ISC",
    "BSD-3-Clause",
]
targets = ["x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

[aws-lc-sys]
accepted = ["OpenSSL"]
