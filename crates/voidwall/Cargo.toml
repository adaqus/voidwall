[package]
name = "voidwall"
version = "0.1.0"
edition = "2024"
autobenches = false

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP framework & server
axum = "0.8"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
http-body-util = "0.1"

# TLS
tokio-rustls = "0.26"
rustls = "0.23"
rcgen = "0.13"

# Serialization & config
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
toml = "0.8"
csv = "1"

# Metrics
prometheus = "0.13"
lazy_static = "1"

# Process metrics
procfs = "0.17"

# Utilities
bytes = "1"
crossbeam-channel = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["cors"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Allocator
tikv-jemallocator = "0.6"

# PII scanning
voidwall-pii = { path = "../voidwall-pii" }
regex = "1"
percent-encoding = "2"

# OpenAPI spec generation
utoipa = "5"

# HTTP client for the AI4Privacy eval binary (see benches/ai4privacy_eval.rs).
# Optional and only pulled in under the `eval` feature so default builds and the
# deployed proxy image carry no extra client stack. Also a dev-dependency below,
# used unconditionally by the integration tests.
reqwest = { version = "0.12", features = ["json"], optional = true }

[features]
default = []
# Builds the AI4Privacy effectiveness-eval binary. Off by default — it is a
# benchmarking tool, not part of the proxy. Run via `docker/ctl eval`.
eval = ["dep:reqwest"]

[[bin]]
name = "echo-server"
path = "benches/echo_server.rs"

[[bin]]
name = "ai4privacy-eval"
path = "benches/ai4privacy_eval.rs"
required-features = ["eval"]

[dev-dependencies]
test-case = "3.3.1"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
