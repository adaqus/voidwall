app = 'voidwall'
primary_region = 'ams'

[build]
  dockerfile = 'docker/Dockerfile.fly'

[http_service]
  internal_port = 8083
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[checks]
  [checks.readyz]
    port = 9090
    type = 'http'
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/readyz'

[[vm]]
  memory = '512mb'
  cpus = 2
  memory_mb = 512

[[statics]]
  guest_path = '/srv/demo'
  url_prefix = '/demo'
