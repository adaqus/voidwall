name: Release

# A version tag, pushed by `docker/ctl release`, publishes the image. A manual
# run is a dry run: it runs the checks, builds the image, smoke-tests it, and
# prints the release notes, and it publishes nothing. Only a tag ref publishes.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/adaqus/voidwall

# Actions are pinned to commit SHAs; the comment names the ref they came from.
jobs:
  # Runs first, so a tag that does not name the workspace version fails before
  # the checks start.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the workspace version
        id: version
        run: |
          version="$(awk '
            /^\[/ { in_package = ($0 == "[workspace.package]") }
            in_package && /^version = / { gsub(/"/, "", $3); print $3 }
          ' Cargo.toml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::[workspace.package] version '$version' is not X.Y.Z"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check that the tag names the workspace version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [ "$TAG" = "v$VERSION" ] \
            || { echo "::error::tag $TAG does not name the workspace version $VERSION"; exit 1; }

  check:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      attestations: read

  image:
    needs: [version, check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # docker/fetch-ort.sh verifies the attestation of the ONNX Runtime archive.
      attestations: read
    env:
      CARGO_TERM_COLOR: always
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      # Vectorscan is built from source by vectorscan-rs-sys.
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libboost-dev patch xz-utils

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-deny,cargo-about

      # Keyed by the script, which holds the pinned version and archive hash, as
      # in ci.yml. The script re-hashes a restored library and fetches again
      # unless it matches.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ort
          key: ort-${{ hashFiles('docker/fetch-ort.sh') }}

      # Keyed by the script, which holds the pinned hashes. The script verifies
      # every restored file and fetches again any that does not match.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: models-${{ hashFiles('docker/fetch-models.sh') }}

      - name: Fetch and verify the models
        run: docker/fetch-models.sh

      - name: Build the release binary
        run: docker/ctl compile
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build the image
        run: |
          docker build --platform linux/amd64 -f docker/Dockerfile.voidwall \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" \
            -t "voidwall:$VERSION" .

      - name: Smoke-test the image
        run: docker/smoke-test.sh "voidwall:$VERSION" "$VERSION"

      # A tag needs its section; a dry run before the first release has no
      # CHANGELOG.md yet, so it only warns.
      - name: Cut the release notes from CHANGELOG.md
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          mkdir -p release
          if [ -f CHANGELOG.md ]; then
            awk -v heading="## [$VERSION]" '
              index($0, heading) == 1 { on = 1; next }
              /^## \[/ { on = 0 }
              on
            ' CHANGELOG.md > release/notes.md
          fi
          if [ ! -s release/notes.md ]; then
            if [ "$REF_TYPE" = tag ]; then
              echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1
            fi
            echo "::warning::CHANGELOG.md has no section for $VERSION"
          fi
          echo "--- release notes for $VERSION ---"
          cat release/notes.md 2>/dev/null || true

      # `publish` pushes exactly the image that passed the smoke test.
      - name: Save the image
        if: github.ref_type == 'tag'
        run: docker save "voidwall:$VERSION" -o release/image.tar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: release
          path: release/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [version, image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Push the image
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker load -i release/image.tar
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "$VERSION" "${VERSION%.*}" latest; do
            docker tag "voidwall:$VERSION" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file release/notes.md
