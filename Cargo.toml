[package]
name = "pii"
description = "Library detecting various Personally Identifiable Information"
version = "0.1.0"
edition = "2024"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
vectorscan-rs = "0.0.5"
percent-encoding = "2"
log = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
test-case = "3"

[[bench]]
name = "pii_benchmark"
harness = false
