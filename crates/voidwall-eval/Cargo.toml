[package]
name = "voidwall-eval"
description = "Offline evaluation of the voidwall-pii regex engine against AI4Privacy"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true

[dependencies]
voidwall-pii = { path = "../voidwall-pii" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1.12.0"
test-case = "3.3.1"

# Run with `docker/ctl ai4p-eval`, which fetches the dataset first.
[[bin]]
name = "ai4privacy-eval"
path = "src/main.rs"

# Run with `docker/ctl piimb-eval`, which fetches the benchmark and scores the spans.
[[bin]]
name = "piimb-spans"
path = "src/bin/piimb_spans.rs"
