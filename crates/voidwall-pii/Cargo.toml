[package]
name = "voidwall-pii"
description = "PII detection library for Voidwall"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
vectorscan-rs = "0.0.5"
percent-encoding = "2"
log = "0.4"

# DictionaryDetector: FST gazetteer membership + Unicode-aware tokenization and
# NFC key normalization. `normalize` is shared with the offline build tool so
# build-time and query-time keys can never drift.
fst = "0.4"
unicode-segmentation = "1"
unicode-normalization = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
test-case = "3"

[features]
# Marker feature gating the offline `build_names_fst` bin so it isn't compiled
# in normal builds/tests. It pulls in no extra deps (the bin reuses the crate's
# runtime `fst` + `unicode-normalization`).
build-names-fst = []

[[bench]]
name = "pii_benchmark"
harness = false

# Offline gazetteer build tool — produces data/names.fst from the source
# name lists. Not compiled into the proxy. Run with:
#   cargo run -p voidwall-pii --features build-names-fst --bin build_names_fst
[[bin]]
name = "build_names_fst"
path = "tools/build_names_fst.rs"
required-features = ["build-names-fst"]
