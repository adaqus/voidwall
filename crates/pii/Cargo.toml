[package]
name = "pii"
description = "Library detecting various Personally Identifiable Information"
version = "0.1.0"
edition = "2024"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
vectorscan-rs = "0.0.5"
percent-encoding = "2"
log = "0.4"

# DictionaryDetector (PersonName): FST gazetteer membership + Unicode-aware
# tokenization. Also used by the offline `build_names_fst` tool.
fst = "0.4"
unicode-segmentation = "1"
# NFC normalization — currently only the offline `build_names_fst` tool needs
# it (feature `build-names-fst`); the proxy build does not pull it in.
unicode-normalization = { version = "0.1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
test-case = "3"

[features]
# Enables the standalone offline FST build tool. Build-time only — the proxy
# image never enables this, so `unicode-normalization` stays out of it.
build-names-fst = ["dep:unicode-normalization"]

[[bench]]
name = "pii_benchmark"
harness = false

# Offline gazetteer build tool — produces data/names_en.fst from the source
# name lists. Not compiled into the proxy. Run with:
#   cargo run -p pii --features build-names-fst --bin build_names_fst
[[bin]]
name = "build_names_fst"
path = "tools/build_names_fst.rs"
required-features = ["build-names-fst"]
