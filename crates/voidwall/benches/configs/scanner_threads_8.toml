# Reverse proxy with 8 scanner thread(s), request scanning on.

[pii]
countries = []
languages = []
scanner_threads = 8

[scan]
on_error = "fail_open"

[reverse_proxy]
enabled = true
listen = "0.0.0.0:8082"

[reverse_proxy.request]
scan = true

[reverse_proxy.response]
scan = false

[[reverse_proxy.routes]]
path_prefix = "/"
upstream = "http://127.0.0.1:8090"

[admin]
listen = "127.0.0.1:9090"
