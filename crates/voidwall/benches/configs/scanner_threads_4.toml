# Reverse proxy with 4 scanner thread(s), request scanning on.

# Ingest keys come first: a bare key written after a [section] binds to
# that section and is rejected.
on_error = "fail_open"

[builtin_guards.pii]
countries = []
languages = []
scanner_threads = 4

[reverse_proxy]
enabled = true
listen = "0.0.0.0:8082"

[reverse_proxy.request]
scan = true

[reverse_proxy.response]
scan = false

[[reverse_proxy.routes]]
path_prefix = "/"
upstream = "http://127.0.0.1:8090"

[admin]
listen = "127.0.0.1:9090"
